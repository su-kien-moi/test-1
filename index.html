<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060f">
<title>Chúc Mừng Ngày Nhà Giáo Việt Nam 20/11 🌷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #05060f;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, "PingFang SC",
                 "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: radial-gradient(circle at 50% 115%, #2b1a3d 0%, #140f26 45%, #05060f 100%);
    position: relative;
    touch-action: manipulation;
  }

  /* ================= NỀN SAO ================= */
  .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkleStar 3s ease-in-out infinite;
  }
  @keyframes twinkleStar {
    0%, 100% { opacity: .12; transform: scale(.6); }
    50%      { opacity: 1;   transform: scale(1.25); }
  }

  /* ================= HOA BAY ================= */
  .lanterns {
    position: fixed; inset: 0; z-index: 2;
    overflow: hidden; pointer-events: none;
  }
  .lantern {
    position: absolute; bottom: -15vh; line-height: 1;
    will-change: transform;
    animation-name: flyUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .lantern span {
    display: inline-block;
    animation-name: glowLantern, swayLantern;
    animation-timing-function: ease-in-out, ease-in-out;
    animation-iteration-count: infinite, infinite;
    animation-direction: alternate, alternate;
  }
  @keyframes flyUp {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(var(--dx, 0px), -125vh, 0) rotate(var(--rot, 0deg)); }
  }
  @keyframes glowLantern {
    from { opacity: .35; filter: drop-shadow(0 0 3px rgba(255, 120, 170, .8)); }
    to   { opacity: 1;   filter: drop-shadow(0 0 16px rgba(255, 215, 120, 1)); }
  }
  @keyframes swayLantern {
    from { transform: translateX(-7px) scale(.94); }
    to   { transform: translateX(7px)  scale(1.06); }
  }

  /* ================= CHỮ CHẠY ================= */
  .textTrack {
    position: fixed; left: 0; right: 0; top: 100%;
    z-index: 3; padding: 0 7vw 60px;
    text-align: center; pointer-events: none;
  }
  .textTrack.running {
    animation: rise var(--dur, 200s) linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0); }
    to   { transform: translateY(calc(-100% - 100vh)); }
  }

  body:not(.started) .textTrack.running { animation-play-state: paused; }
  body:not(.started) .lantern,
  body:not(.started) .lantern span     { animation-play-state: paused; }

  .textTrack h1 {
    font-size: clamp(42px, 11vw, 110px);
    font-weight: 900; letter-spacing: .1em; margin-bottom: 8px;
    background: linear-gradient(90deg, #ffe08a, #ff8fb8, #ffe08a);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(255, 170, 90, .6));
    animation: shine 5s linear infinite;
  }
  @keyframes shine { to { background-position: 200% 0; } }

  .textTrack h2 {
    font-size: clamp(15px, 3.4vw, 30px);
    font-weight: 800; letter-spacing: .16em;
    color: #ffd97a;
    text-shadow: 0 0 18px rgba(255, 190, 80, .75);
    margin-bottom: 34px;
  }
  .textTrack h2.end {
    margin-top: 34px; margin-bottom: 40px;
    color: #ffb3cd;
    text-shadow: 0 0 18px rgba(255, 120, 170, .8);
  }

  .textTrack p {
    max-width: 920px;
    margin: 0 auto 16px;
    font-size: clamp(14px, 2.2vw, 19px);
    line-height: 1.75;
    color: rgba(255, 255, 255, .86);
    text-shadow: 0 0 14px rgba(160, 180, 255, .4);
  }
  .textTrack p.big {
    font-size: clamp(17px, 2.9vw, 25px);
    font-weight: 700; color: #fff;
    line-height: 1.55; margin: 22px auto 22px;
  }
  .textTrack p.quote {
    font-style: italic;
    color: #ffc4dc;
    text-shadow: 0 0 16px rgba(255, 120, 170, .65);
    margin: 22px auto 22px;
    font-size: clamp(15px, 2.4vw, 21px);
  }

  .textTrack .divider {
    width: 90px; height: 2px; margin: 30px auto;
    background: linear-gradient(90deg, transparent, #ffd97a, transparent);
    border-radius: 2px;
  }

  /* ===== PHẦN TIẾNG TRUNG ===== */
  .textTrack .cnBlock {
    max-width: 900px; margin: 0 auto;
    padding: 26px 26px 30px;
    border: 1px solid rgba(255, 217, 122, .35);
    border-radius: 18px;
    background: rgba(255, 200, 120, .05);
    box-shadow: 0 0 30px rgba(255, 180, 90, .12) inset;
  }
  .textTrack .cnTitle {
    font-size: clamp(22px, 4.4vw, 38px);
    font-weight: 900; letter-spacing: .18em;
    color: #ffd97a;
    text-shadow: 0 0 22px rgba(255, 190, 80, .85);
    margin-bottom: 20px;
  }
  .textTrack .cnText {
    font-size: clamp(15px, 2.6vw, 22px);
    line-height: 2; letter-spacing: .06em;
    color: #ffe3b0;
    text-shadow: 0 0 14px rgba(255, 200, 120, .55);
    margin-bottom: 14px;
  }
  .textTrack .cnText:last-child {
    margin-bottom: 0;
    color: #ffc4dc;
    text-shadow: 0 0 14px rgba(255, 120, 170, .6);
  }

  /* ================= MÀN HÌNH MỞ ĐẦU ================= */
  .startOverlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(5, 6, 15, .92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity .7s ease, visibility .7s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .startOverlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .startContent {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px;
    pointer-events: none;
  }

  .startBtn {
    width: 130px; height: 130px;
    border-radius: 50%;
    border: 2px solid rgba(255, 217, 122, .55);
    background: radial-gradient(circle at 30% 30%,
                rgba(255, 217, 122, .18),
                rgba(30, 20, 50, .9));
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(255, 180, 90, .4);
    animation: pulseStart 2.2s ease-in-out infinite;
    transition: transform .25s ease, box-shadow .3s ease;
    pointer-events: auto;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .startBtn:active { transform: scale(.95); }
  @media (hover: hover) {
    .startBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 70px rgba(255, 180, 90, .85);
    }
  }
  @keyframes pulseStart {
    0%, 100% { box-shadow: 0 0 40px rgba(255, 180, 90, .4); }
    50%      { box-shadow: 0 0 75px rgba(255, 180, 90, .95); }
  }

  .playIcon {
    width: 52px; height: 52px;
    filter: drop-shadow(0 0 14px rgba(255, 217, 122, .9));
    pointer-events: none;
  }

  .startHint {
    font-size: 13px; letter-spacing: .28em;
    text-transform: uppercase;
    color: rgba(255, 217, 122, .85);
    text-shadow: 0 0 14px rgba(255, 180, 90, .7);
    animation: hintBlink 2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes hintBlink {
    0%, 100% { opacity: .45; }
    50%      { opacity: 1; }
  }

  /* ===== NÚT TẮT NHẠC ===== */
  .musicBtn {
    position: fixed; top: 14px; right: 14px; z-index: 999;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255, 217, 122, .6);
    background: rgba(30, 20, 50, .65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #ffd97a;
    font-size: 20px; line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    box-shadow: 0 0 20px rgba(255, 180, 90, .35);
    -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .musicBtn.show { display: flex; }
  .musicBtn.playing {
    animation: pulseMusic 1.8s ease-in-out infinite;
  }
  @keyframes pulseMusic {
    0%, 100% { box-shadow: 0 0 18px rgba(255, 180, 90, .45); }
    50%      { box-shadow: 0 0 34px rgba(255, 180, 90, .9); }
  }
</style>
</head>

    "Chúng bay lên như những hy vọng mà thầy cô đã gieo vào lòng chúng em.",
    "Cảm ơn thầy cô đã cho chúng em một tuổi học trò thật đẹp.",
    "Cảm ơn thầy cô đã cho chúng em một tuổi trẻ thật ý nghĩa.",
    "Cảm ơn thầy cô đã cho chúng em một niềm tin thật vững chắc vào cuộc đời.",
    "Dù mai này có đi đâu, làm gì, chúng em vẫn mãi là học trò của thầy cô.",
    "Dù thời gian có trôi qua bao lâu, ơn thầy cô vẫn vẹn nguyên trong tim.",
    "Chúc mừng Ngày Nhà giáo Việt Nam 20/11!",

    "HAPPY TEACHER'S DAY – 20/11!"
  ];

  (function renderLines() {
    const container = document.getElementById('lines');
    const frag = document.createDocumentFragment();
    const bigIdx = new Set([0, 49, 98, 99]);
    LINES.forEach((text, i) => {
      const p = document.createElement('p');
      p.textContent = text;
      if (bigIdx.has(i)) p.classList.add('big');
      else if (/^[“"]/.test(text)) p.classList.add('quote');
      frag.appendChild(p);
    });
    container.appendChild(frag);
  })();

  /* ---------- Tốc độ chữ chạy: 45 = NHANH (cũ là 28) ---------- */
  (function autoSpeed() {
    const track = document.getElementById('textTrack');
    const SPEED_PX_PER_SEC = 45;   // 👈 ĐÃ TĂNG TỪ 28 → 45

    function apply() {
      const travel = track.scrollHeight + window.innerHeight;
      const dur = (travel / SPEED_PX_PER_SEC).toFixed(1);
      track.style.setProperty('--dur', dur + 's');
      track.classList.add('running');
    }
    requestAnimationFrame(apply);
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        track.classList.remove('running');
        track.style.removeProperty('--dur');
        requestAnimationFrame(apply);
      }, 200);
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        track.classList.remove('running');
        track.style.removeProperty('--dur');
        requestAnimationFrame(apply);
      }, 300);
    });
  })();

  (function createStars() {
    const sky = document.getElementById('stars');
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 160; i++) {
      const s = document.createElement('i');
      s.className = 'star';
      const size = (Math.random() * 2 + 1).toFixed(2);
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (Math.random() * 100).toFixed(2) + 'vw';
      s.style.top  = (Math.random() * 100).toFixed(2) + 'vh';
      s.style.animationDuration = (2 + Math.random() * 3).toFixed(2) + 's';
      s.style.animationDelay    = (Math.random() * 3).toFixed(2) + 's';
      frag.appendChild(s);
    }
    sky.appendChild(frag);
  })();

  /* ---------- Hoa bay: 7s–16s = NHANH (cũ là 10s–24s) ---------- */
  (function createLanterns() {
    const box = document.getElementById('lanterns');
    const TOTAL = 100;
    const frag = document.createDocumentFragment();

    for (let i = 0; i < TOTAL; i++) {
      const el = document.createElement('div');
      el.className = 'lantern';
      const span = document.createElement('span');
      span.textContent = '🌷';
      el.appendChild(span);

      const size     = 14 + Math.random() * 26;
      const duration = 7 + Math.random() * 9;   // 👈 ĐÃ TĂNG TỐC (7s–16s)
      const delay    = -(Math.random() * duration);
      const drift    = (Math.random() * 2 - 1) * 110;
      const rotate   = (Math.random() * 2 - 1) * 70;

      el.style.left = (Math.random() * 100).toFixed(2) + 'vw';
      el.style.fontSize = size.toFixed(1) + 'px';
      el.style.setProperty('--dx', drift.toFixed(1) + 'px');
      el.style.setProperty('--rot', rotate.toFixed(1) + 'deg');
      el.style.animationDuration = duration.toFixed(2) + 's';
      el.style.animationDelay = delay.toFixed(2) + 's';

      span.style.animationDuration =
        (1.2 + Math.random() * 1.8).toFixed(2) + 's, ' +
        (1.6 + Math.random() * 2.2).toFixed(2) + 's';
      span.style.animationDelay =
        (Math.random() * 2).toFixed(2) + 's, ' +
        (Math.random() * 2).toFixed(2) + 's';

      frag.appendChild(el);
    }
    box.appendChild(frag);
  })();

  /* ============================================================
     MÀN HÌNH MỞ ĐẦU + NHẠC — TỐI ƯU iOS / ANDROID / PC
     ============================================================ */
  (function startScreen() {
    const overlay  = document.getElementById('startOverlay');
    const btn      = document.getElementById('startBtn');
    const audio    = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const body     = document.body;

    let started = false;
    try { audio.volume = 0.6; } catch (e) {}

    function playMusic() {
      try { audio.load(); } catch (e) {}
      const p = audio.play();
      if (p && typeof p.then === 'function') {
        p.then(() => {
          musicBtn.textContent = '🔊';
          musicBtn.classList.add('playing');
        }).catch((err) => {
          console.warn('Lỗi phát nhạc:', err.name, err.message);
          musicBtn.textContent = '🔇';
          musicBtn.classList.remove('playing');
        });
      }
    }

    function start(e) {
      if (started) return;
      started = true;
      if (e && e.cancelable) e.preventDefault();

      body.classList.add('started');
      overlay.classList.add('hidden');
      musicBtn.classList.add('show');

      playMusic();

      btn.removeEventListener('click', start);
      btn.removeEventListener('touchend', start);
      overlay.removeEventListener('click', start);
    }

    btn.addEventListener('click', start);
    btn.addEventListener('touchend', start);
    overlay.addEventListener('click', start);

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        playMusic();
      } else {
        audio.pause();
        musicBtn.textContent = '🔇';
        musicBtn.classList.remove('playing');
      }
    });
  })();
</script>
